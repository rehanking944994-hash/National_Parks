<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
                               <!-- navbar start -->

<header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-1 border-bottom">
    <a href="" class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none"> 
        <img src="images/ChatGPT Image Jul 30, 2026, 02_22_02 PM.png" alt="National Parks" style="height: 90px; width: 140px; object-fit: contain;">
    </a>
      
    <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        <li><a href="#" class="nav-link px-2 link-secondary">Home</a></li>
        <li><a href="#" class="nav-link px-2 link-dark">Features</a></li>
        <li><a href="#" class="nav-link px-2 link-dark">Pricing</a></li>
        <li><a href="#" class="nav-link px-2 link-dark">FAQs</a></li>
        <li><a href="#" class="nav-link px-2 link-dark">About</a></li>
    </ul>

    <div class="col-md-3 text-end">
        <button type="button" class="btn btn-success me-3"> Plan Your Visit</button>
    </div>
</header>
                          <!-- navbar end -->

<!-- Detail Page Section -->

<div id="detailPageDesign">

</div>

<script>

var url = location.href;

var obj = new URL(url);

var image = obj.searchParams.get("image");
var name = obj.searchParams.get("name");
var parkLocation = obj.searchParams.get("location");
var description = obj.searchParams.get("description");
var about = obj.searchParams.get("about");


var detailPageDesign = 

`
<div class="container py-5">
    <div class="card">
        <div class="row g-0">

            <div class="col-md-6">
                <img src="${image}" class="img-fluid rounded-start h-100" style="object-fit: cover;" alt="${name}">
            </div>

            <div class="col-md-6">
                <div class="card-body p-4">

                    <h1 class="card-title fw-bold">
                        ${name}
                    </h1>

                    <p class="text-success fw-bold">
                        📍 ${parkLocation}
                    </p>

                    <h4 class="mt-4">
                        About the Park
                    </h4>

                    <p class="card-text text-muted">
                        ${about}
                    </p>

                    <h4 class="mt-4">
                        Things To Do
                    </h4>

                    <p>
                        🚶 Walking
                    </p>

                    <p>
                        📸 Photography
                    </p>

                    <p>
                        👨‍👩‍👧 Family Picnic
                    </p>

                    <h4 class="mt-4">
                        Visitor Tips
                    </h4>

                    <p class="text-muted">
                        🌿 Keep the park clean<br>
                        🚯 Do not litter<br>
                        💧 Carry drinking water
                    </p>

                    <a href="index.html"
                       class="btn btn-success rounded-pill px-4 mt-2">
                        ← Back to Parks
                    </a>

                </div>
            </div>
        </div>
    </div>
</div>`




document.getElementById("detailPageDesign").innerHTML = detailPageDesign;

</script>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
